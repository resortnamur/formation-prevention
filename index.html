<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FORMATION SÉCURITÉ — Circus Casino Resort Namur</title>
  <style>
    :root {
      --red: #cc0000;
      --gold: #b38f4d;
      --gold-light: #d4a855;
      --black: #0a0a0a;
      --gray: #141414;
      --gray2: #1c1c1c;
      --border: rgba(179,143,77,.22);
      --text: #e0e0e0;
      --muted: #777;
      --green: #10b981;
      --red-soft: rgba(204,0,0,.10);
      --green-soft: rgba(16,185,129,.10);
      --gold-soft: rgba(179,143,77,.09);
      --warn: #f59e0b;
      --warn-soft: rgba(245,158,11,.10);
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--black);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── SHELL ── */
    .shell { min-height: 100vh; display: flex; flex-direction: column; }

    /* ── TOP BAR ── */
    .top-bar {
      background: linear-gradient(90deg, #0a0a0a 60%, #180000);
      border-bottom: 2px solid var(--gold);
      padding: 0 24px;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .top-title {
      font-size: .85rem;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .top-right {
      font-size: .8rem;
      color: var(--muted);
      white-space: nowrap;
    }

    /* ── PROGRESS BAR ── */
    .progress-bar-wrap { height: 3px; background: rgba(255,255,255,.05); flex-shrink: 0; }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--red), var(--gold));
      transition: width .4s ease;
    }

    /* ── CHAPTER INDICATOR ── */
    .chapter-bar {
      padding: 7px 24px;
      background: var(--gray2);
      border-bottom: 1px solid rgba(255,255,255,.05);
      font-size: .72rem;
      color: var(--gold);
      letter-spacing: .1em;
      text-transform: uppercase;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 32px;
    }
    .chapter-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); flex-shrink: 0; }

    /* ── MAIN ── */
    .main {
      flex: 1;
      padding: 24px 20px 32px;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
    }

    /* ── CARD ── */
    .card {
      background: var(--gray2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
    }

    /* ── CHAPTER INTRO CARD ── */
    .ch-card {
      background: linear-gradient(135deg, #1c1c1c, #160000);
      border: 1px solid var(--red);
      border-radius: 14px;
      padding: 32px 24px;
      text-align: center;
    }
    .ch-num { font-size: 3.5rem; font-weight: 800; color: var(--red); line-height: 1; margin-bottom: 8px; }
    .ch-title { font-size: 1.35rem; font-weight: 700; color: var(--gold); margin-bottom: 12px; }
    .ch-desc { color: #aaa; line-height: 1.65; margin: 0; font-size: .95rem; }

    /* ── COVER ── */
    .cover-heading { font-size: 1.6rem; font-weight: 800; color: var(--gold); line-height: 1.2; margin: 0 0 4px; }
    .cover-sub { color: var(--red); font-size: .82rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; margin: 0 0 20px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
    .chip { border-radius: 20px; padding: 5px 12px; font-size: .78rem; font-weight: 600; }
    .chip-gray { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); color: #bbb; }
    .chip-red { background: var(--red-soft); border: 1px solid rgba(204,0,0,.35); color: #fca5a5; }
    .chip-gold { background: var(--gold-soft); border: 1px solid var(--border); color: var(--gold); }
    .chip-green { background: var(--green-soft); border: 1px solid rgba(16,185,129,.35); color: #6ee7b7; }

    /* ── TEXT CONTENT ── */
    .page-title { font-size: 1.15rem; font-weight: 700; color: #fff; margin: 0 0 6px; }
    .page-sub { color: var(--muted); font-size: .88rem; margin: 0 0 18px; }
    .content p { color: var(--text); line-height: 1.68; margin: 10px 0; font-size: .95rem; }
    .content ul, .content ol { padding-left: 20px; margin: 8px 0; }
    .content li { color: var(--text); line-height: 1.6; margin: 6px 0; font-size: .95rem; }
    .content strong { color: #fff; }

    /* ── CALLOUTS ── */
    .callout { border-radius: 8px; padding: 11px 14px; margin: 14px 0; font-size: .88rem; line-height: 1.6; }
    .callout-warn  { background: var(--warn-soft);  border-left: 3px solid var(--warn);  color: #fcd34d; }
    .callout-danger{ background: var(--red-soft);   border-left: 3px solid var(--red);   color: #fca5a5; }
    .callout-ok    { background: var(--green-soft); border-left: 3px solid var(--green); color: #6ee7b7; }
    .callout-info  { background: var(--gold-soft);  border-left: 3px solid var(--gold);  color: #d4a855; }

    .hr { height: 1px; background: var(--border); margin: 18px 0; }

    /* ── QUIZ ── */
    .quiz-badge {
      display: inline-block;
      background: var(--red);
      color: #fff;
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 12px;
    }
    .quiz-q { font-weight: 700; color: #fff; font-size: 1rem; margin: 0 0 16px; line-height: 1.5; }
    .choices { list-style: none; padding: 0; margin: 0; display: grid; gap: 9px; }
    .choice {
      border: 1px solid rgba(255,255,255,.11);
      border-radius: 10px;
      padding: 11px 14px;
      cursor: pointer;
      user-select: none;
      transition: all .15s;
      color: var(--text);
      font-size: .93rem;
      line-height: 1.45;
      background: rgba(255,255,255,.03);
    }
    .choice:hover:not(.locked) { border-color: var(--gold); background: var(--gold-soft); }
    .choice.correct  { border-color: var(--green); background: var(--green-soft); color: #a7f3d0; }
    .choice.wrong    { border-color: var(--red);   background: var(--red-soft);   color: #fca5a5; }
    .choice.revealed { border-color: var(--green); background: rgba(16,185,129,.06); color: #6ee7b7; opacity: .75; }
    .choice.locked   { cursor: default; }

    .feedback {
      display: none;
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: .88rem;
      line-height: 1.55;
    }
    .feedback.ok { display: block; background: var(--green-soft); border: 1px solid rgba(16,185,129,.30); color: #a7f3d0; }
    .feedback.ko { display: block; background: var(--red-soft);   border: 1px solid rgba(204,0,0,.30);   color: #fca5a5; }

    .btn-reveal {
      display: none;
      margin-top: 12px;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 8px;
      color: #ccc;
      font-size: .82rem;
      padding: 7px 14px;
      cursor: pointer;
      transition: all .15s;
    }
    .btn-reveal:hover { background: rgba(255,255,255,.12); }
    .btn-reveal.visible { display: inline-block; }

    .quiz-hint { margin-top: 10px; font-size: .82rem; color: var(--muted); }

    /* ── SCORE ── */
    .score-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--gold-soft);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: .78rem;
      color: var(--gold);
      font-weight: 700;
    }

    /* ── ACTIONS ── */
    .actions {
      padding: 14px 20px;
      display: flex;
      gap: 10px;
      align-items: center;
      border-top: 1px solid rgba(255,255,255,.06);
      background: var(--gray);
      flex-shrink: 0;
      position: sticky;
      bottom: 0;
      z-index: 50;
    }
    .btn {
      border: 0;
      border-radius: 10px;
      padding: 10px 20px;
      font-weight: 700;
      font-size: .88rem;
      cursor: pointer;
      transition: all .15s;
    }
    .btn-primary  { background: var(--red);              color: #fff; }
    .btn-primary:hover  { background: #aa0000; }
    .btn-secondary{ background: rgba(255,255,255,.08);   color: var(--text); }
    .btn-secondary:hover{ background: rgba(255,255,255,.14); }
    .btn-gold     { background: var(--gold); color: #000; }
    .btn-gold:hover { background: var(--gold-light); }
    .btn:disabled { opacity: .35; cursor: not-allowed; }

    /* ── STATS (conclusion) ── */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px,1fr)); gap: 12px; margin: 20px 0; }
    .stat-box { background: rgba(255,255,255,.04); border: 1px solid var(--border); border-radius: 10px; padding: 16px; text-align: center; }
    .stat-val { font-size: 1.9rem; font-weight: 800; color: var(--gold); }
    .stat-lbl { font-size: .78rem; color: var(--muted); margin-top: 3px; }

    /* ── CONTACT LIST ── */
    .contact-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 9px; }
    .contact-item { background: rgba(255,255,255,.04); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
    .contact-lbl { font-size: .7rem; color: var(--gold); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 3px; }
    .contact-val { color: #fff; font-size: .93rem; }
    .contact-val a { color: var(--gold); text-decoration: none; }
    .contact-val a:hover { text-decoration: underline; }

    /* ── GATE ── */
    .gate-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
    .gate-input {
      flex: 1; min-width: 160px;
      background: rgba(255,255,255,.06);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: #fff;
      padding: 10px 14px;
      font-size: .93rem;
      outline: none;
    }
    .gate-input:focus { border-color: var(--gold); }
    .gate-status { margin-top: 12px; font-size: .88rem; min-height: 1.3em; }
    .gate-status.ok { color: #6ee7b7; }
    .gate-status.ko { color: #fca5a5; }

    /* ── PIU BOX ── */
    .piu-box {
      background: var(--gold-soft);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      margin-top: 20px;
      font-size: .88rem;
      color: #ccc;
    }
    .piu-box strong { color: var(--gold); }
    .piu-box a { color: var(--gold); font-weight: 600; text-decoration: none; }
    .piu-box a:hover { text-decoration: underline; }

    /* ── ADMIN ── */
    .admin-link {
      position: fixed; bottom: 68px; right: 16px;
      font-size: .68rem; color: transparent;
      cursor: pointer; user-select: none; z-index: 9999; padding: 4px;
    }
    .admin-link:hover { color: var(--muted); }

    /* ── TOC ── */
    .toc-list { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 7px; }
    .toc-item {
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      transition: all .15s;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: .88rem;
    }
    .toc-item:hover { border-color: var(--gold); background: var(--gold-soft); }
    .toc-num { font-size: .72rem; color: var(--muted); min-width: 26px; }
    .toc-badge {
      font-size: .68rem; color: var(--red);
      background: var(--red-soft); border-radius: 10px;
      padding: 2px 8px; font-weight: 700;
      margin-left: auto; flex-shrink: 0;
    }
    .toc-badge.ch { color: var(--gold); background: var(--gold-soft); }

    @media (max-width: 600px) {
      .main { padding: 14px 12px 28px; }
      .card { padding: 16px; }
      .top-bar, .chapter-bar, .actions { padding-left: 14px; padding-right: 14px; }
    }
  </style>
</head>
<body>
<div class="shell">

  <!-- TOP BAR -->
  <div class="top-bar">
    <div class="top-title">Formation Sécurité</div>
    <div class="top-right" id="topRight">Page 1 / 1</div>
  </div>
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressBar" style="width:0%"></div>

    <span id="chapterLabel">Introduction</span>
  </div>

  <!-- STAGE -->
  <div class="main">
    <div class="card" id="stage"></div>
  </div>

  <!-- ACTIONS -->
  <div class="actions">
    <button type="button" class="btn btn-secondary" id="prevBtn">Retour</button>
    <button type="button" class="btn btn-primary"   id="nextBtn">Suite</button>
    <div style="margin-left:auto;">
      <div class="score-badge" id="scoreBadge" title="Bonnes réponses / questions posées">Score : 0 / 0</div>
    </div>
  </div>
</div>

<div class="admin-link" id="adminLink">·</div>

/* ======================================================

   ====================================================== */
function setProgress() {
  topRight.textContent = `Page ${idx + 1} / ${PAGES.length}`;
  progressBar.style.width = `${((idx + 1) / PAGES.length) * 100}%`;
  const page = PAGES[idx];
  chapterLabel.textContent = (page && page.chapter) ? page.chapter : "";
}

function setButtons() {
  prevBtn.disabled = (idx === 0);
  const isLast = (idx === PAGES.length - 1);
  nextBtn.disabled = isLast ? true : (!allowNext && !adminMode);
  nextBtn.textContent = isLast ? "Terminé" : "Suite";
}

function updateScore() {
  scoreBadge.textContent = `Score : ${scoreCorrect} / ${scoreTotal}`;
}

function makeList(items, ordered) {
  const el = document.createElement(ordered ? "ol" : "ul");
  items.forEach(t => {
    const li = document.createElement("li");
    li.innerHTML = t;
    el.appendChild(li);
  });
  return el;
}

/* ======================================================
   RENDERERS
   ====================================================== */

function renderContent(container, blocks) {
  (blocks || []).forEach(b => {
    if (b.p) {
      const p = document.createElement("p");
      p.innerHTML = b.p;
      container.appendChild(p);
    } else if (b.html) {
      const d = document.createElement("div");
      d.innerHTML = b.html;
      container.appendChild(d);
    } else if (b.ul) {
      container.appendChild(makeList(b.ul, false));
    } else if (b.ol) {
      container.appendChild(makeList(b.ol, true));
    } else if (b.callout) {
      const d = document.createElement("div");
      d.className = `callout callout-${b.callout}`;
      d.textContent = b.text;
      container.appendChild(d);
    } else if (b.chips) {
      const wrap = document.createElement("div");
      wrap.className = "chips";
      b.chips.forEach(c => {
        const span = document.createElement("span");
        span.className = `chip ${c.cls || "chip-gray"}`;
        span.textContent = c.label;
        wrap.appendChild(span);
      });
      container.appendChild(wrap);
    }
  });
}

function renderCover(page) {
  const root = document.createElement("div");
  const h = document.createElement("div");
  h.className = "cover-heading";
  h.textContent = page.title;
  root.appendChild(h);
  const sub = document.createElement("div");
  sub.className = "cover-sub";
  sub.textContent = page.sub || "";
  root.appendChild(sub);
  const content = document.createElement("div");
  content.className = "content";
  renderContent(content, page.blocks);
  root.appendChild(content);

  const piuBox = document.createElement("div");
  piuBox.className = "piu-box";
  piuBox.innerHTML = `<strong>Plan Interne d'Urgence</strong> — Consultez le PIU complet et ses annexes : <a href="piu.html">Ouvrir le PIU →</a>`;
  root.appendChild(piuBox);

  return root;
}

function renderChapter(page) {
  const card = document.createElement("div");
  card.className = "ch-card";
  const num = document.createElement("div");
  num.className = "ch-num";
  num.textContent = page.num;
  card.appendChild(num);
  const title = document.createElement("div");
  title.className = "ch-title";
  title.textContent = page.chapterTitle;
  card.appendChild(title);
  const desc = document.createElement("p");
  desc.className = "ch-desc";
  desc.textContent = page.desc;
  card.appendChild(desc);
  return card;
}

function renderText(page) {
  const root = document.createElement("div");
  const t = document.createElement("div");
  t.className = "page-title";
  t.textContent = page.title;
  root.appendChild(t);
  if (page.subtitle) {
    const s = document.createElement("div");
    s.className = "page-sub";
    s.textContent = page.subtitle;
    root.appendChild(s);
  }
  const content = document.createElement("div");
  content.className = "content";
  renderContent(content, page.blocks);
  root.appendChild(content);
  return root;
}

function renderQuiz(page) {
  const root = document.createElement("div");

  const badge = document.createElement("div");
  badge.className = "quiz-badge";
  badge.textContent = "Question";
  root.appendChild(badge);

  const q = document.createElement("div");
  q.className = "quiz-q";
  q.textContent = page.question;
  root.appendChild(q);

  const ul = document.createElement("ul");
  ul.className = "choices";

  const feedback = document.createElement("div");
  feedback.className = "feedback";

  const btnReveal = document.createElement("button");
  btnReveal.className = "btn-reveal";
  btnReveal.textContent = "Voir la bonne réponse";

  quizAnswered = false;
  allowNext = adminMode ? true : false;

  page.choices.forEach(c => {
    const li = document.createElement("li");
    const btn = document.createElement("div");
    btn.className = "choice";
    btn.textContent = c.label;

    btn.addEventListener("click", () => {
      if (quizAnswered) return;
      quizAnswered = true;
      scoreTotal++;

      ul.querySelectorAll(".choice").forEach(el => el.classList.add("locked"));

      if (c.correct) {
        btn.classList.add("correct");
        scoreCorrect++;
        feedback.innerHTML = `<strong>Bonne réponse !</strong>${page.hint ? ' ' + page.hint : ''}`;
        feedback.classList.add("ok");
        allowNext = true;
      } else {
        btn.classList.add("wrong");
        feedback.innerHTML = `<strong>Mauvaise réponse.</strong>${page.hint ? ' ' + page.hint : ''}`;
        feedback.classList.add("ko");
        allowNext = false;
        btnReveal.classList.add("visible");
      }
      updateScore();
      setButtons();
    });

    li.appendChild(btn);
    ul.appendChild(li);
  });

  btnReveal.addEventListener("click", () => {
    ul.querySelectorAll(".choice").forEach(el => {
      const txt = el.textContent;
      const match = page.choices.find(c => c.label === txt && c.correct);
      if (match) el.classList.add("revealed");
    });
    btnReveal.style.display = "none";
    allowNext = true;
    setButtons();
  });

  root.appendChild(ul);
  root.appendChild(feedback);
  root.appendChild(btnReveal);

  const hint = document.createElement("div");
  hint.className = "quiz-hint";
  hint.textContent = "Choisissez une réponse pour continuer.";
  root.appendChild(hint);

  return root;
}

function renderConclusion() {
  const root = document.createElement("div");

  const h = document.createElement("div");
  h.className = "cover-heading";
  h.style.marginBottom = "4px";
  h.textContent = "Félicitations !";
  root.appendChild(h);

  const sub = document.createElement("div");
  sub.className = "cover-sub";
  sub.textContent = "Formation complétée";
  root.appendChild(sub);

  const p = document.createElement("p");
  p.style.color = "#bbb";
  p.style.marginBottom = "4px";
  p.textContent = "Merci pour votre attention et votre implication. La vigilance collective protège chacun.";
  root.appendChild(p);

  const stats = document.createElement("div");
  stats.className = "stats-grid";
  stats.innerHTML = `
    <div class="stat-box">
      <div class="stat-val">${scoreCorrect}</div>
      <div class="stat-lbl">Bonnes réponses</div>
    </div>
    <div class="stat-box">
      <div class="stat-val">${scoreTotal}</div>
      <div class="stat-lbl">Questions posées</div>
    </div>
    <div class="stat-box">
      <div class="stat-val">${scoreTotal > 0 ? Math.round((scoreCorrect/scoreTotal)*100) : 0}%</div>
      <div class="stat-lbl">Taux de réussite</div>
    </div>
  `;
  root.appendChild(stats);

  const hr = document.createElement("div");
  hr.className = "hr";
  root.appendChild(hr);

  const links = document.createElement("div");
  links.className = "content";
  links.innerHTML = `
    <p><strong>Des questions ?</strong><br>
    <a href="mailto:christophe.vankerrebroeck@casinoresortnamur.be" style="color:var(--gold);">christophe.vankerrebroeck@casinoresortnamur.be</a></p>
  `;
  root.appendChild(links);

  const piuBox = document.createElement("div");
  piuBox.className = "piu-box";
  piuBox.innerHTML = `<strong>Étape suivante :</strong> consultez le <a href="piu.html">Plan Interne d'Urgence (PIU) →</a>`;
  root.appendChild(piuBox);

  return root;
}

function renderMailGate() {
  stage.innerHTML = "";

  const root = document.createElement("div");

  const h = document.createElement("div");
  h.className = "page-title";
  h.textContent = "Confirmer votre participation";
  root.appendChild(h);

  const p = document.createElement("p");
  p.style.color = "#bbb";
  p.style.fontSize = ".9rem";
  p.textContent = "Indiquez votre nom complet pour enregistrer que vous avez suivi cette formation. Cette information est transmise à l'équipe de prévention.";
  root.appendChild(p);

  const row = document.createElement("div");
  row.className = "gate-row";

  const input = document.createElement("input");
  input.type = "text";
  input.className = "gate-input";
  input.placeholder = "Prénom et nom";
  row.appendChild(input);

  const btn = document.createElement("button");
  btn.className = "btn btn-gold";
  btn.textContent = "Valider";
  row.appendChild(btn);

  root.appendChild(row);

  const status = document.createElement("div");
  status.className = "gate-status";
  root.appendChild(status);

  stage.appendChild(root);
  allowNext = false;
  setButtons();
  setProgress();

  btn.onclick = async () => {
    const nom = input.value.trim();
    if (!nom || nom.length < 3) {
      status.textContent = "Veuillez indiquer votre prénom et votre nom.";
      status.className = "gate-status ko";
      return;
    }
    status.textContent = "Envoi en cours…";
    status.className = "gate-status";
    btn.disabled = true;
    input.disabled = true;
    try {
      const resp = await fetch(SHEET_WEBAPP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ nom, source: "formation-securite" })
      });
      let data = null;
      try { data = await resp.json(); } catch(e) { throw new Error("Réponse invalide"); }
      if (!resp.ok || !data || data.ok !== true) {
        throw new Error(data && data.error ? data.error : `Erreur HTTP ${resp.status}`);
      }
      status.textContent = "✓ Participation enregistrée. Merci !";
      status.className = "gate-status ok";
      finalConfirmed = true;
      allowNext = true;
      setButtons();
    } catch(err) {
      console.error(err);
      status.textContent = "Erreur d'enregistrement. Veuillez réessayer ou contacter le conseiller en prévention.";
      status.className = "gate-status ko";
      btn.disabled = false;
      input.disabled = false;
    }
  };

  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ======================================================
   RENDER MAIN
   ====================================================== */
function render() {
  const page = PAGES[idx];
  stage.innerHTML = "";

  // Admin link (visible uniquement page 0)
  adminLink.style.visibility = (idx === 0) ? "visible" : "hidden";

  if (page.type === "cover") {
    stage.classList.remove("ch-card");
    stage.appendChild(renderCover(page));
    allowNext = true;
  } else if (page.type === "chapter") {
    stage.innerHTML = "";
    stage.appendChild(renderChapter(page));
    allowNext = true;
  } else if (page.type === "text") {
    stage.appendChild(renderText(page));
    allowNext = true;
  } else if (page.type === "quiz") {
    stage.appendChild(renderQuiz(page));
  } else if (page.type === "conclusion") {
    stage.appendChild(renderConclusion());
    allowNext = false;
    nextBtn.disabled = true;
    nextBtn.textContent = "Terminé";
  } else {
    stage.textContent = "Type de page inconnu.";
    allowNext = true;
  }

  setProgress();
  setButtons();
  syncAdminTocBtn();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ======================================================
   NAVIGATION
   ====================================================== */
prevBtn.addEventListener("click", () => {
  if (idx > 0) { idx--; render(); }
});

nextBtn.addEventListener("click", () => {
  if (!allowNext && !adminMode) return;

  const cur = PAGES[idx];
  // Déclencher la gate de confirmation avant la page conclusion
  if (!adminMode && cur && cur.type === "quiz" && cur.chapter === "Conclusion" && !finalConfirmed) {
    renderMailGate();
    return;
  }

  if (idx < PAGES.length - 1) { idx++; render(); }
});

/* ======================================================
   ADMIN
   ====================================================== */
adminLink.addEventListener("click", () => {
  const code = window.prompt("Code :");
  if (code === null) return;
  if (String(code).trim() === "d") {
    adminMode = true;
    finalConfirmed = true;
    renderTOC();
  } else {
    window.alert("Code incorrect.");
  }
});

function syncAdminTocBtn() {
  let existing = document.getElementById("adminTocBtn");
  if (adminMode) {
    if (!existing) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.id = "adminTocBtn";
      btn.className = "btn btn-secondary";
      btn.textContent = "Sommaire";
      btn.style.marginRight = "4px";
      btn.addEventListener("click", renderTOC);
      document.querySelector(".actions").insertBefore(btn, prevBtn);
    }
  } else if (existing) {
    existing.remove();
  }
}

function renderTOC() {
  stage.innerHTML = "";

  const root = document.createElement("div");
  const t = document.createElement("div");
  t.className = "page-title";
  t.textContent = "Sommaire (mode admin)";
  root.appendChild(t);

  const ul = document.createElement("ul");
  ul.className = "toc-list";

  // Gate
  const gateLi = document.createElement("li");
  gateLi.className = "toc-item";
  gateLi.innerHTML = `<span class="toc-num">—</span><span>Page de confirmation</span><span class="toc-badge ch">Technique</span>`;
  gateLi.addEventListener("click", renderMailGate);
  ul.appendChild(gateLi);

  PAGES.forEach((p, i) => {
    const li = document.createElement("li");
    li.className = "toc-item";
    const label = p.title || p.chapterTitle || (p.type === "quiz" ? "Quiz" : p.type) || "Page";
    li.innerHTML = `<span class="toc-num">${i + 1}</span><span>${label}</span><span class="toc-badge${p.type === 'chapter' ? ' ch' : ''}">${p.type}</span>`;
    li.addEventListener("click", () => { idx = i; render(); });
    ul.appendChild(li);
  });

  root.appendChild(ul);
  stage.appendChild(root);
  allowNext = true;
  setProgress();
  setButtons();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ======================================================
   INIT
   ====================================================== */
render();
</script>
